# Builds the plugin on both Linux and Windows (the two platforms Endstone
# actually supports) so a broken build never slips through on either one.
# When a "v*" tag is pushed, the wheel also gets attached to a Release.
name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install hatch
        run: pip install hatch

      - name: Build wheel
        run: hatch build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: endstone-scoreboard-${{ matrix.os }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install hatch
        run: pip install hatch

      # The plugin is pure Python, so one wheel already works on both
      # Linux and Windows - no need to attach a copy from each OS.
      - name: Build wheel
        run: hatch build

      - name: Attach wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
