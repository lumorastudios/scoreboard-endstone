[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-scoreboard"
version = "1.1.0"
description = "Configurable sidebar scoreboard plugin for Endstone servers."
authors = [
    { name = "Appolo" }
]
requires-python = ">=3.10"

[project.entry-points."endstone"]
scoreboard = "endstone_scoreboard:ScoreboardPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_scoreboard"]

[tool.hatch.build.targets.wheel.force-include]
"src/endstone_scoreboard/config.toml" = "endstone_scoreboard/config.toml"
